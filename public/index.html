<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Admin · handwritten style</title>

  <!-- Google Fonts: a clean handwritten script that feels bold & friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">

  <style>
    /* --- minimal reset & full centering --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fbf7f0;          /* soft paper-like background */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, 'Segoe UI', Roboto, sans-serif; /* fallback only */
    }

    /* --- handwritten statement card --- */
    .handwritten-card {
      max-width: 1000px;
      width: 100%;
      text-align: center;

      /* subtle "notebook page" effect – optional but keeps it clean */
      background: #fffcf8;
      padding: 3.5rem 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.03);
      border: 1px solid #f0e7de;
    }

    /* THE handwritten statement – bold, large, hand-drawn feel */
    .contact-admin {
      font-family: 'Kalam', 'Comic Sans MS', 'Segoe Script', cursive;
      font-weight: 700;               /* bold as requested */
      font-size: clamp(3rem, 15vw, 7rem);
      line-height: 1.2;
      color: #2e1b0e;                 /* warm dark brown, like ink */
      
      /* hand-written style extras */
      letter-spacing: 0.02em;
      text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.03), 0 0 1px #d9c6b0; /* faint ink bleed */
      
      /* avoid clipping */
      overflow-wrap: break-word;
      word-break: break-word;
      
      /* optional: slightly rotated? – no, keep readable */
      transform: rotate(-0.5deg);     /* subtle organic tilt */
      transition: transform 0.2s ease;
      
      /* ensure no unwanted decorations */
      text-decoration: none;
    }

    /* fine-tune the tilt on hover (optional, just for life) */
    .contact-admin:hover {
      transform: rotate(0deg) scale(1.01);
    }

    /* for very narrow screens */
    @media (max-width: 480px) {
      .handwritten-card {
        padding: 2rem 1.2rem;
        border-radius: 1.5rem;
      }
      .contact-admin {
        font-size: clamp(2.4rem, 16vw, 3.8rem);
      }
    }

    /* accessible smoothness */
    @media (prefers-reduced-motion: reduce) {
      .contact-admin {
        transform: none;
        transition: none;
      }
      .contact-admin:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="handwritten-card">
    <!-- handwritten, bold statement -->
    <div class="contact-admin">Contact Admin Now</div>
  </div>
</body>
</html>
