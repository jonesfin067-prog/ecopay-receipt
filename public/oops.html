<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EcoCash · Something Went Wrong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --eco-blue: #0045A0;
    --eco-red: #E31B23;
    --eco-green: #00A651;
    --eco-text-main: #111827;
    --eco-text-muted: #6B7280;
    --eco-bg: #F3F6FA;
    --eco-border: #E5E9F0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    min-height: 100%;
    background: var(--eco-bg);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--eco-text-main);
    -webkit-font-smoothing: antialiased;
  }

  .app-layout {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 16px 14px 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px;
  }
  .logo-link {
    display: flex;
    align-items: baseline;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    text-decoration: none;
    line-height: 1;
  }
  .logo-eco { color: var(--eco-blue); }
  .logo-cash { color: var(--eco-red); margin-left: 1px; }

  .receipt-card {
    background: #FFFFFF;
    border-radius: 24px;
    border: 1px solid var(--eco-border);
    box-shadow: 0 10px 32px rgba(0,69,160,0.05);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
  }

  .oops-ring {
    width: 88px; height: 88px; border-radius: 50%;
    background: #FEE2E2;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 8px rgba(227,27,35,0.08);
    animation: pop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .oops-core {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--eco-red);
    display: flex; align-items: center; justify-content: center;
    color: #FFFFFF; font-size: 32px; font-weight: 800;
  }

  .status-heading {
    font-size: 22px; font-weight: 800; letter-spacing: -0.4px;
    margin-bottom: 6px;
  }
  .status-subtitle {
    font-size: 13.5px; color: var(--eco-text-muted);
    line-height: 1.45; max-width: 340px;
  }

  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .btn-primary {
    width: 100%;
    padding: 15px;
    background: var(--eco-blue);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: #003478; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%;
    padding: 15px;
    background: #FFFFFF;
    color: var(--eco-blue);
    border: 1.5px solid var(--eco-border);
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-secondary:hover { background: #F8FAFD; }

  .bottom-text {
    text-align: center; font-size: 12px; color: #94A3B8;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="app-layout">

  <header class="brand-header">
    <a href="/" class="logo-link">
      <span class="logo-eco">Eco</span><span class="logo-cash">Cash</span>
    </a>
  </header>

  <main class="receipt-card">

    <div class="oops-ring">
      <div class="oops-core">!</div>
    </div>

    <div>
      <h1 class="status-heading">Oops, Something Went Wrong</h1>
      <p class="status-subtitle">We couldn't complete this transaction. Please try again or start a new payment.</p>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="tryAgain()">Try Again</button>
      <button class="btn-secondary" onclick="goHome()">Back to Home</button>
    </div>

  </main>

  <div class="bottom-text">Powered by EcoCash · Secure payment verification</div>

</div>

<script>
function tryAgain() {
  const params = window.location.search || '';
  window.location.href = 'client.html' + params;
}

function goHome() {
  window.location.href = '/';
}
</script>
</body>
</html>
